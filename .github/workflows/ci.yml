name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - name: Check (typecheck, lint, layers, raw values, i18n, unit tests)
        run: npm run check
      - name: Build (production env guard)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - run: npx playwright install --with-deps chromium
      - name: Slice demos (desktop, mobile, RTL, axe)
        run: npm run e2e

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sagol_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The public Data API, as Supabase runs it in front of the database (D-203). It retries until
      # Postgres is up; `test:rest` makes it reload the schema once the migrations have run.
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/sagol_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          # A throwaway signing key for this CI container only; it guards nothing.
          PGRST_JWT_SECRET: ci-only-postgrest-signing-key-not-a-secret
        ports: ['3000:3000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the server function (Deno)
        run: deno check --config supabase/functions/commands/deno.json supabase/functions/commands/index.ts
      - name: Migrations, schema drift, triggers, contract suite over the gateway
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sagol_test
      - name: The Data API refuses the API roles every table
        run: npm run test:rest
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sagol_test
          POSTGREST_URL: http://localhost:3000
          POSTGREST_JWT_SECRET: ci-only-postgrest-signing-key-not-a-secret
