name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - name: Check (typecheck, lint, layers, raw values, i18n, unit tests)
        run: npm run check
      - name: Build (production env guard)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - run: npx playwright install --with-deps chromium
      - name: Slice demos (desktop, mobile, RTL, axe)
        run: npm run e2e
