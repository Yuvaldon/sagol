name: Staging

# Continuous delivery to the staging environment (D-276): after CI passes on main, the staging
# Supabase project gets main's pending migrations, main's `commands` function and its secrets, and
# the `staging` branch moves to the same commit, and the branch's Vercel Deploy Hook builds its Preview at a
# stable address (D-292): Vercel's GitHub integration does not build a push that brings no new commits.
# Production is never touched here: its migrations stay a manual, reviewed step.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERCEL_STAGING_DEPLOY_HOOK: ${{ secrets.VERCEL_STAGING_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Reads the one project, not the account's list, and tries the later steps' read calls first (D-276).
      - name: Refuse any project whose name does not end in -staging
        run: >-
          scripts/supabase-project-guard.sh staging /functions /secrets /config/database/pooler
      # Before any change, so a missing hook never leaves the database ahead of the Preview (D-292).
      - name: Refuse to start without the staging Deploy Hook
        run: |
          test -n "$VERCEL_STAGING_DEPLOY_HOOK" ||
            { echo "::error::the secret VERCEL_STAGING_DEPLOY_HOOK is not set in the staging environment (OI-231)"; exit 1; }
          echo "::add-mask::$VERCEL_STAGING_DEPLOY_HOOK"
      # No `supabase link`: it needs the revealed API keys, which CD does not (D-289).
      - name: Migrations
        run: |
          db_url=$(scripts/supabase-db-url.sh)
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --workdir .
      - name: Function secrets
        run: >-
          supabase secrets set --project-ref "$PROJECT_REF"
          "APP_ORIGINS=${{ vars.STAGING_APP_ORIGINS }}"
          "BOOTSTRAP_OWNER_EMAIL=${{ secrets.STAGING_BOOTSTRAP_OWNER_EMAIL }}"
      - name: The commands function (the bundle of D-209)
        run: |
          npm run build:function
          mkdir -p dist/staging/supabase/functions/commands
          cp dist/functions/commands/index.ts dist/staging/supabase/functions/commands/index.ts
          supabase functions deploy commands --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --workdir dist/staging
      - name: Move the staging branch
        run: git push --force origin "$SHA:refs/heads/staging"
      # The hook builds the branch's head, the commit just pushed; the URL is a secret and is never printed (D-292).
      - name: Build the staging Preview through its Deploy Hook
        run: |
          echo "::add-mask::$VERCEL_STAGING_DEPLOY_HOOK"
          response=$(curl -sS --fail-with-body -X POST "$VERCEL_STAGING_DEPLOY_HOOK") ||
            { echo "::error::the staging Deploy Hook (VERCEL_STAGING_DEPLOY_HOOK) refused the request" >&2; exit 1; }
          jq -er '"Vercel job \(.job.id) \(.job.state)"' <<<"$response" ||
            { echo "::error::the staging Deploy Hook (VERCEL_STAGING_DEPLOY_HOOK) returned no job" >&2; exit 1; }
