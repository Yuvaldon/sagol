name: Staging

# Continuous delivery to the staging environment (D-276): after CI passes on main, the staging
# Supabase project gets main's pending migrations, main's `commands` function and its secrets, and
# `staging` gets a new commit with main's tree whose only parent is main's commit, which Vercel builds as the branch's
# Preview at a stable address (D-292): Vercel's GitHub integration does not build a push that brings no new commits.
# Production is never touched here: its migrations stay a manual, reviewed step.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Reads the one project, not the account's list, and tries the later steps' read calls first (D-276).
      - name: Refuse any project whose name does not end in -staging
        run: >-
          scripts/supabase-project-guard.sh staging /functions /secrets /config/database/pooler
      # No `supabase link`: it needs the revealed API keys, which CD does not (D-289).
      - name: Migrations
        run: |
          db_url=$(scripts/supabase-db-url.sh)
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --workdir .
      - name: Function secrets
        run: >-
          supabase secrets set --project-ref "$PROJECT_REF"
          "APP_ORIGINS=${{ vars.STAGING_APP_ORIGINS }}"
          "BOOTSTRAP_OWNER_EMAIL=${{ secrets.STAGING_BOOTSTRAP_OWNER_EMAIL }}"
      - name: The commands function (the bundle of D-209)
        run: |
          npm run build:function
          mkdir -p dist/staging/supabase/functions/commands
          cp dist/functions/commands/index.ts dist/staging/supabase/functions/commands/index.ts
          supabase functions deploy commands --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --workdir dist/staging
      # A new commit, so Vercel builds it; same tree as main, so staging runs exactly main's code (D-292).
      - name: Move the staging branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          lease=""
          if git fetch origin staging; then lease=$(git rev-parse FETCH_HEAD); fi
          commit=$(git commit-tree "$SHA^{tree}" -p "$SHA" -m "staging: deploy $SHA")
          git push --force-with-lease="refs/heads/staging:$lease" origin "$commit:refs/heads/staging"
      - name: Check that staging holds main's tree on main's commit
        run: |
          git fetch origin staging
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse "$SHA^{tree}")" ||
            { echo "::error::staging's tree differs from $SHA's" >&2; exit 1; }
          test "$(git rev-parse 'FETCH_HEAD^@')" = "$SHA" ||
            { echo "::error::staging's only parent is not $SHA" >&2; exit 1; }
          echo "staging $(git rev-parse FETCH_HEAD) = tree of $SHA, parent $SHA"
