name: Staging

# Continuous delivery to the staging environment (D-276): after CI passes on main, the staging
# Supabase project gets main's pending migrations, main's `commands` function and its secrets, and
# the `staging` branch moves to the same commit, so Vercel builds its Preview at a stable address.
# Production is never touched here: its migrations stay a manual, reviewed step.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Reads the one project, not the account's list, and tries the later steps' read calls first (D-276).
      - name: Refuse any project whose name does not end in -staging
        run: >-
          scripts/supabase-project-guard.sh staging /functions /secrets
          -- /api-keys /config/database/pooler /postgrest /config/auth
      - name: Migrations
        run: |
          supabase link --project-ref "$PROJECT_REF" --workdir .
          supabase db push --linked --workdir .
      - name: Function secrets
        run: >-
          supabase secrets set --project-ref "$PROJECT_REF"
          "APP_ORIGINS=${{ vars.STAGING_APP_ORIGINS }}"
          "BOOTSTRAP_OWNER_EMAIL=${{ secrets.STAGING_BOOTSTRAP_OWNER_EMAIL }}"
      - name: The commands function (the bundle of D-209)
        run: |
          npm run build:function
          mkdir -p dist/staging/supabase/functions/commands
          cp dist/functions/commands/index.ts dist/staging/supabase/functions/commands/index.ts
          supabase functions deploy commands --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --workdir dist/staging
      - name: Move the staging branch, which Vercel builds as the staging Preview
        run: git push --force origin "$SHA:refs/heads/staging"
