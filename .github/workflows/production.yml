name: Production

# The production release (D-280, made manual by D-340): only the owner starts it, by hand, after approving a release.
# It takes a commit of main that Staging delivered (main's head unless one is named), brings the production Supabase
# project to it (pending migrations, then the `commands` function) and only then moves the `production` branch, which
# Vercel builds as Production, so the frontend never gets ahead of the backend.
# Production holds real data: nothing here deletes, resets or sets secrets, and a pending migration that drops,
# truncates or deletes without a WHERE stops the run unless the migration carries the explicit marker.
# No GitHub environment: the values are repository-level, and the main-only rule is the job's own checks below.

on:
  workflow_dispatch:
    inputs:
      confirm_ref:
        description: The production project ref, typed again to confirm
        required: true
        type: string
      sha:
        description: The full SHA of the main commit to release (empty = main's head)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
      CONFIRM_REF: ${{ inputs.confirm_ref }}
      SHA: ${{ inputs.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      DESTRUCTIVE_MARKER: '-- production: destructive change approved'
    steps:
      - name: Refuse a SHA that is not a full commit id
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the SHA must be 40 lowercase hex characters"; exit 1; }
      - name: Refuse a commit whose CI did not pass
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --event push \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          test "$conclusion" -ge 1 || { echo "::error::CI has not passed on $SHA"; exit 1; }
      - name: Refuse a commit that Staging did not deliver
        run: |
          staged=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Staging --commit "$SHA" --branch main \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          test "$staged" -ge 1 || { echo "::error::Staging has not succeeded for $SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      # The branch's commit carries the release's tree, so its vercel.json must let Vercel build `production` (D-340).
      - name: Refuse a tree whose vercel.json does not build production
        run: |
          jq -e '.git.deploymentEnabled.production == true' vercel.json >/dev/null ||
            { echo "::error::vercel.json at $SHA does not enable the production branch"; exit 1; }
      # Migrations only go forward, so a release never takes the frontend back behind what production already runs.
      - name: Refuse a commit behind the one production holds
        run: |
          if git fetch --no-tags origin production; then
            # A release commit's only parent is the release; a branch set straight to a main commit is that commit.
            current=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$current" origin/main || current=$(git rev-parse 'FETCH_HEAD^')
            git merge-base --is-ancestor "$current" "$SHA" ||
              { echo "::error::production holds $current, and $SHA does not contain it"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          LEFTHOOK: '0'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Refuse any project but the exact production ref
        run: |
          test -n "$PROJECT_REF" || { echo "::error::PRODUCTION_PROJECT_REF is not set"; exit 1; }
          test "$CONFIRM_REF" = "$PROJECT_REF" || { echo "::error::the typed ref is not PRODUCTION_PROJECT_REF"; exit 1; }
          scripts/supabase-project-guard.sh production /functions /config/database/pooler
      # No `supabase link`: it needs the revealed API keys, which CD does not (D-289).
      - name: Migrations (the plan, the destructive-change guard, then the push)
        run: |
          db_url=$(scripts/supabase-db-url.sh)
          echo "::add-mask::$db_url"
          supabase db push --db-url "$db_url" --workdir . --dry-run 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          test "${PIPESTATUS[0]}" -eq 0 || exit 1
          blocked=0
          for file in $(grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' "$RUNNER_TEMP/plan.txt" | sort -u); do
            path="supabase/migrations/$file"
            test -f "$path" || { echo "::error::the plan names $file, which is not in supabase/migrations"; exit 1; }
            if grep -qF -- "$DESTRUCTIVE_MARKER" "$path"; then
              echo "::warning::$file carries the destructive-change marker"
              continue
            fi
            found=$(perl -0777 -ne '
              s/--[^\n]*//g;
              for my $s (split /;/) {
                if ($s =~ /\b(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE)\b/i ||
                    ($s =~ /\bDELETE\s+FROM\b/i && $s !~ /\bWHERE\b/i)) {
                  (my $t = $s) =~ s/\s+/ /g; $t =~ s/^ //; print substr($t, 0, 160), "\n";
                }
              }' "$path")
            if [ -n "$found" ]; then
              echo "::error::$file has a destructive statement and no marker:"
              echo "$found"
              blocked=1
            fi
          done
          test "$blocked" -eq 0 || exit 1
          supabase db push --db-url "$db_url" --workdir .
      # Runs only when every step above succeeded: a failed db push stops the job before the function changes.
      - name: The commands function (the bundle of D-209)
        run: |
          npm run build:function
          sha256sum dist/functions/commands/index.ts
          mkdir -p dist/production/supabase/functions/commands
          cp dist/functions/commands/index.ts dist/production/supabase/functions/commands/index.ts
          supabase functions deploy commands --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --workdir dist/production
      # Last, after the db push and the function: Vercel builds the `production` branch as Production (D-340). A new
      # commit with the release's tree and the release as its only parent, as staging does (D-292).
      - name: Move the production branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          lease=""
          if git fetch origin production; then lease=$(git rev-parse FETCH_HEAD); fi
          commit=$(git commit-tree "$SHA^{tree}" -p "$SHA" -m "production: release $SHA")
          git push --force-with-lease="refs/heads/production:$lease" origin "$commit:refs/heads/production"
      - name: Check that production holds the release's tree on the release's commit
        run: |
          git fetch origin production
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse "$SHA^{tree}")" ||
            { echo "::error::production's tree differs from $SHA's" >&2; exit 1; }
          test "$(git rev-parse 'FETCH_HEAD^@')" = "$SHA" ||
            { echo "::error::production's only parent is not $SHA" >&2; exit 1; }
          echo "production $(git rev-parse FETCH_HEAD) = tree of $SHA, parent $SHA"
